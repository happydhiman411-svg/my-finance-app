<!DOCTYPE html>
<html lang="hi" class="light">
<!-- 🔍 APNE HEAD TAG KE ANDAR IN LINKS KO REPLACE KAREIN -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Personal Finance Dashboard</title>
  
  <!-- Tailwind CSS with secure HTTPS crossorigin -->
  <script src="https://tailwindcss.com" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    tailwind.config = { 
      darkMode: 'class' 
    }
  </script>
  
  <!-- Chart.js with secure HTTPS crossorigin -->
  <script src="https://jsdelivr.net" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <!-- FontAwesome Icons with secure HTTPS crossorigin -->
  <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="bg-slate-100 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-200">

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-700">
      <div class="text-center mb-6">
        <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
          <i class="fa-solid fa-wallet text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Pro Finance Manager</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Cloud Sync Dashboard</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Username</label>
          <input type="text" id="userInput" placeholder="Enter Username" autocomplete="off" class="w-full border dark:border-slate-600 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-700 focus:bg-white outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Password</label>
          <input type="password" id="passInput" placeholder="Enter Password" autocomplete="new-password" class="w-full border dark:border-slate-600 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-700 focus:bg-white outline-none">
        </div>
        <button onclick="checkLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">Dashboard Login</button>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboardPage" class="hidden p-4 md:p-8 max-w-7xl mx-auto space-y-6">
    
    <!-- TOP NAVBAR -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-slate-800 p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 gap-4">
      <div>
        <h1 class="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2">📊 Financial Dashboard</h1>
        <div class="flex flex-wrap items-center gap-2 mt-2">
          <div id="streakBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold"></div>
          <div id="cloudSyncBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border dark:border-slate-600">
            ⚡ Checking Connection...
          </div>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="fetchFromSheet()" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1"><i class="fa-solid fa-rotate"></i> Sync Refresh</button>
        <button onclick="openExpressModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5"><i class="fa-solid fa-bolt"></i> ⚡ Express Entry</button>
        <button onclick="openCatModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5"><i class="fa-solid fa-list-check"></i> Categories & Budget</button>
        <button onclick="openSettingsModal()" class="bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5"><i class="fa-solid fa-gear text-amber-400"></i> Settings</button>
        <button onclick="logout()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-3 py-2 rounded-xl">Logout</button>
      </div>
    </div>

    <!-- DATE & MONTH FILTER BAR -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-xs font-bold">
        <i class="fa-solid fa-filter text-blue-500"></i> Filter Period:
        <select id="filterType" onchange="handleFilterChange()" class="border dark:border-slate-600 p-1.5 rounded-xl bg-slate-50 dark:bg-slate-700 text-xs">
          <option value="all" selected>All Time</option>
          <option value="this_month">This Month</option>
          <option value="custom_month">Specific Month</option>
          <option value="custom_range">Date Range</option>
        </select>
      </div>
      <div class="flex items-center gap-2" id="filterInputsContainer"></div>
    </div>

    <!-- METRIC CARDS -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
      <div class="bg-emerald-500 text-white p-4 rounded-2xl shadow-sm"><p class="text-[10px] uppercase font-bold opacity-80">Total Income</p><h3 class="text-xl md:text-2xl font-black mt-1" id="totalIncome">₹0</h3></div>
      <div class="bg-rose-500 text-white p-4 rounded-2xl shadow-sm"><p class="text-[10px] uppercase font-bold opacity-80">Total Expense</p><h3 class="text-xl md:text-2xl font-black mt-1" id="totalExpense">₹0</h3></div>
      <div class="bg-amber-500 text-white p-4 rounded-2xl shadow-sm"><p class="text-[10px] uppercase font-bold opacity-80">Udhaar Diya</p><h3 class="text-xl md:text-2xl font-black mt-1" id="totalAdvGiven">₹0</h3></div>
      <div class="bg-sky-500 text-white p-4 rounded-2xl shadow-sm"><p class="text-[10px] uppercase font-bold opacity-80">Udhaar Liya</p><h3 class="text-xl md:text-2xl font-black mt-1" id="totalAdvTaken">₹0</h3></div>
      <div class="bg-indigo-600 text-white p-4 rounded-2xl shadow-sm col-span-2 md:col-span-1"><p class="text-[10px] uppercase font-bold opacity-80">Net Balance</p><h3 class="text-xl md:text-2xl font-black mt-1" id="netBalance">₹0</h3></div>
    </div>

    <div id="budgetAlertContainer" class="hidden space-y-2"></div>

    <!-- ENTRY FORM & CHART -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 lg:col-span-1">
        <h2 class="text-md font-bold text-slate-800 dark:text-white mb-4">➕ Single Fast Entry</h2>
        <form onsubmit="addSingleEntry(event)" class="space-y-3">
          <div>
            <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400">TYPE</label>
            <select id="entryType" class="w-full border dark:border-slate-600 p-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 font-semibold outline-none">
              <option value="Expense">Expense (Kharch)</option>
              <option value="Income">Income (Paise Aaye)</option>
              <option value="Advance Given">Udhaar Diya (Given)</option>
              <option value="Advance Taken">Udhaar Liya (Taken)</option>
              <option value="Savings">Savings (RD/FD/EMI)</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400">DATE</label>
              <input type="date" id="entryDate" required class="w-full border dark:border-slate-600 p-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 outline-none">
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400">CATEGORY</label>
              <select id="entryCategory" class="w-full border dark:border-slate-600 p-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 outline-none"></select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400">PERSON</label>
              <input type="text" id="entryPerson" placeholder="Self, Papa..." class="w-full border dark:border-slate-600 p-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 outline-none">
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400">AMOUNT (₹)</label>
              <input type="number" id="entryAmount" required placeholder="0" class="w-full border dark:border-slate-600 p-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 font-bold outline-none">
            </div>
          </div>

          <div>
            <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400">NOTE</label>
            <input type="text" id="entryNote" placeholder="Details..." class="w-full border dark:border-slate-600 p-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 outline-none">
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold text-sm shadow-md transition">Save Record</button>
        </form>
      </div>

      <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 lg:col-span-2">
        <h2 class="text-md font-bold text-slate-800 dark:text-white mb-2">Category Wise Expense Breakdown</h2>
        <div class="w-full h-64 flex items-center justify-center">
          <canvas id="financeChart"></canvas>
        </div>
      </div>
    </div>

    <!-- TRANSACTIONS TABLE -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
